<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>erofic.ai - Chat Engine Tester</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --panel-bg: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.1);
      --primary-color: #6366f1;
      --primary-hover: #4f46e5;
      --accent-color: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --user-msg-bg: #312e81;
      --assistant-msg-bg: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(to right, #818cf8, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-weight: 500;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.3);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 8px #34d399;
    }

    .container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 320px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 1rem;
      gap: 1.25rem;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .create-session-card {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    textarea, input[type="text"] {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.6rem 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus, input[type="text"]:focus {
      border-color: var(--primary-color);
    }

    button {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    button:hover {
      background: var(--primary-hover);
    }

    .session-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .session-item {
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 0.6rem;
      padding: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .session-item:hover {
      background: rgba(30, 41, 59, 0.8);
      border-color: rgba(99, 102, 241, 0.4);
    }

    .session-item.active {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--primary-color);
    }

    .session-id {
      font-size: 0.8rem;
      font-weight: 600;
      color: #a5b4fc;
      margin-bottom: 0.2rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-prompt {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Main Chat Area */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(15, 23, 42, 0.4);
    }

    .chat-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      background: rgba(15, 23, 42, 0.6);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .active-session-info {
      font-size: 0.85rem;
    }

    .active-session-info span {
      color: var(--text-muted);
    }

    .messages-container {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message-bubble {
      max-width: 75%;
      padding: 0.85rem 1.1rem;
      border-radius: 1rem;
      font-size: 0.9rem;
      line-height: 1.5;
      position: relative;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-bubble.user {
      align-self: flex-end;
      background: var(--user-msg-bg);
      border-bottom-right-radius: 0.25rem;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .message-bubble.assistant {
      align-self: flex-start;
      background: var(--assistant-msg-bg);
      border-bottom-left-radius: 0.25rem;
      border: 1px solid var(--border-color);
    }

    .message-bubble.system {
      align-self: center;
      max-width: 85%;
      background: rgba(15, 23, 42, 0.7);
      border: 1px dashed rgba(245, 158, 11, 0.4);
      color: #fcd34d;
      font-size: 0.8rem;
      padding: 0.5rem 0.85rem;
      border-radius: 0.6rem;
      text-align: center;
    }

    .message-bubble.system.completed {
      border-color: rgba(52, 211, 153, 0.4);
      color: #6ee7b7;
    }

    .message-bubble.system.cancelled {
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .msg-header {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .msg-role {
      font-weight: 600;
      text-transform: uppercase;
    }

    .msg-role.user { color: #818cf8; }
    .msg-role.assistant { color: #38bdf8; }

    .chat-input-bar {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border-color);
      background: rgba(15, 23, 42, 0.7);
      display: flex;
      gap: 0.75rem;
    }

    .chat-input-bar input {
      flex: 1;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }
  </style>
</head>
<body>

  <header>
    <h1><a href="/" style="text-decoration: none; color: inherit; background: linear-gradient(to right, #818cf8, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">erofic.ai</a></h1>
    <div class="badge">
      <div class="badge-dot"></div>
      Auto-polling Active (2s)
    </div>
  </header>


  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="section-title">New Session</div>
        <div class="create-session-card">
          <label style="font-size:0.75rem; color:var(--text-muted); font-weight:500;">Select Scenario:</label>
          <select id="scenarioSelect" style="width:100%; background:rgba(15,23,42,0.8); border:1px solid var(--border-color); color:var(--text-main); padding:0.6rem; border-radius:0.5rem; font-size:0.85rem; outline:none; cursor:pointer;">
            <option value="">Loading scenarios...</option>
          </select>
          <button onclick="createSession()" style="margin-top:0.4rem;">Start Scenario Session</button>
        </div>
      </div>


      <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
        <div class="section-title">Sessions (<span id="sessionCount">0</span>)</div>
        <div id="sessionList" class="session-list"></div>
      </div>
    </div>

    <!-- Main Chat Area -->
    <div class="chat-area">
      <div class="chat-header">
        <div class="active-session-info">
          Active Session: <strong id="activeSessionId">None</strong>
        </div>
        <button style="padding: 0.35rem 0.75rem; font-size: 0.75rem;" onclick="fetchSessions()">Refresh Sessions</button>
      </div>

      <div id="messagesContainer" class="messages-container">
        <div class="empty-state">
          <p>Select or create a session to start testing.</p>
        </div>
      </div>

      <div style="position:relative;">
        <div id="cmdMenu" style="display:none; position:absolute; bottom:100%; left:1.5rem; background:rgba(15,23,42,0.95); border:1px solid rgba(99,102,241,0.5); border-radius:0.5rem; padding:0.5rem; width:280px; box-shadow:0 -4px 16px rgba(0,0,0,0.5); z-index:100;">
          <div style="font-size:0.7rem; font-weight:600; color:#818cf8; text-transform:uppercase; margin-bottom:0.4rem; padding-left:0.25rem;">Slash Commands</div>
          <div class="cmd-item" onclick="insertCommand('/action ')" style="padding:0.4rem; border-radius:0.25rem; cursor:pointer; font-size:0.85rem; color:#f8fafc; transition:background 0.15s;" onmouseover="this.style.background='rgba(99,102,241,0.3)'" onmouseout="this.style.background='transparent'"><strong>/action</strong> <span style="color:#94a3b8; font-size:0.75rem;">Physical movement/posture</span></div>
          <div class="cmd-item" onclick="insertCommand('/speak ')" style="padding:0.4rem; border-radius:0.25rem; cursor:pointer; font-size:0.85rem; color:#f8fafc; transition:background 0.15s;" onmouseover="this.style.background='rgba(99,102,241,0.3)'" onmouseout="this.style.background='transparent'"><strong>/speak</strong> <span style="color:#94a3b8; font-size:0.75rem;">Spoken dialogue</span></div>
          <div class="cmd-item" onclick="insertCommand('/thought ')" style="padding:0.4rem; border-radius:0.25rem; cursor:pointer; font-size:0.85rem; color:#f8fafc; transition:background 0.15s;" onmouseover="this.style.background='rgba(99,102,241,0.3)'" onmouseout="this.style.background='transparent'"><strong>/thought</strong> <span style="color:#94a3b8; font-size:0.75rem;">Internal character thoughts</span></div>
          <div class="cmd-item" onclick="insertCommand('/phase ')" style="padding:0.4rem; border-radius:0.25rem; cursor:pointer; font-size:0.85rem; color:#f8fafc; transition:background 0.15s;" onmouseover="this.style.background='rgba(99,102,241,0.3)'" onmouseout="this.style.background='transparent'"><strong>/phase</strong> <span style="color:#94a3b8; font-size:0.75rem;">Set active phase (1, 2, 3)</span></div>
        </div>

        <div class="chat-input-bar">
          <input type="text" id="userInput" placeholder="Type a message or / for commands..." oninput="handleInput(event)" onkeypress="handleKeyPress(event)" disabled>
          <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
        </div>
      </div>
    </div>
  </div>


  <script>
    let activeSessionId = null;
    let knownMessageIds = new Set();
    let knownTaskStates = new Map(); // taskId -> status

    async function fetchScenarios() {
      try {
        const res = await fetch('/api/scenes');
        const scenes = await res.json();
        const selectEl = document.getElementById('scenarioSelect');
        if (scenes.length === 0) {
          selectEl.innerHTML = '<option value="">No scenarios available</option>';
          return;
        }
        selectEl.innerHTML = scenes.map(s => `
          <option value="${s.id}">${s.title} (Phase ${s.current_phase})</option>
        `).join('');
      } catch (err) {
        console.error('Error fetching scenarios:', err);
      }
    }

    async function fetchSessions() {
      try {
        const res = await fetch('/sessions');
        const sessions = await res.json();
        const listEl = document.getElementById('sessionList');
        document.getElementById('sessionCount').innerText = sessions.length;

        listEl.innerHTML = '';
        sessions.forEach(s => {
          const item = document.createElement('div');
          item.className = `session-item ${s.id === activeSessionId ? 'active' : ''}`;
          item.onclick = () => selectSession(s.id);
          item.innerHTML = `
            <div class="session-id">${s.id}</div>
            <div class="session-prompt">${s.scene_config_id ? `Scenario Bound: <code style="color:#a5b4fc;">${s.scene_config_id}</code>` : (s.system_prompt || 'Default Session')}</div>
          `;
          listEl.appendChild(item);
        });
      } catch (err) {
        console.error('Error fetching sessions:', err);
      }
    }

    async function createSession() {
      const scenarioId = document.getElementById('scenarioSelect').value;
      if (!scenarioId) {
        alert('Please select a scenario first!');
        return;
      }
      try {
        const res = await fetch('/sessions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ scene_config_id: scenarioId })
        });
        const newSession = await res.json();
        await fetchSessions();
        selectSession(newSession.id);
      } catch (err) {
        console.error('Error creating session:', err);
      }
    }


    function selectSession(sessionId) {
      activeSessionId = sessionId;
      knownMessageIds.clear();
      knownTaskStates.clear();
      document.getElementById('activeSessionId').innerText = sessionId;
      document.getElementById('userInput').disabled = false;
      document.getElementById('sendBtn').disabled = false;
      document.getElementById('messagesContainer').innerHTML = '';
      fetchSessions();
      fetchStream();
    }

    async function fetchStream() {
      if (!activeSessionId) return;

      try {
        // Fetch messages and task events in parallel
        const [msgRes, taskRes] = await Promise.all([
          fetch(`/sessions/${activeSessionId}/messages`),
          fetch(`/sessions/${activeSessionId}/tasks`)
        ]);

        if (!msgRes.ok) return;

        const messages = await msgRes.json();
        const tasks = taskRes.ok ? await taskRes.json() : [];
        const container = document.getElementById('messagesContainer');

        if (messages.length === 0 && tasks.length === 0) {
          if (!container.querySelector('.empty-state')) {
            container.innerHTML = `
              <div class="empty-state">
                <p>No messages yet. Send a message to trigger the engine.</p>
              </div>
            `;
          }
          return;
        }

        // Remove empty state if present
        const emptyState = container.querySelector('.empty-state');
        if (emptyState) {
          container.innerHTML = '';
        }

        const timeline = [];

        messages.forEach(m => {
          timeline.push({
            kind: 'message',
            id: `msg-${m.id}`,
            timestamp: new Date(m.timestamp),
            data: m
          });
        });

        tasks.forEach(t => {
          timeline.push({
            kind: 'task',
            id: `task-${t.id}`,
            timestamp: new Date(t.execute_at),
            data: t
          });
        });

        // Sort strictly by timestamp ascending
        timeline.sort((a, b) => a.timestamp - b.timestamp);

        let newAdded = false;

        timeline.forEach(item => {
          let existingEl = document.getElementById(item.id);

          if (item.kind === 'message') {
            if (!existingEl) {
              const m = item.data;
              const bubble = document.createElement('div');
              bubble.id = item.id;
              bubble.className = `message-bubble ${m.role}`;
              const formattedTime = item.timestamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

              bubble.innerHTML = `
                <div class="msg-header">
                  <span class="msg-role ${m.role}">${m.role}</span>
                  <span>${formattedTime}</span>
                </div>
                <div class="msg-content">${escapeHtml(m.content)}</div>
              `;
              container.appendChild(bubble);
              newAdded = true;
            }
          } else if (item.kind === 'task') {
            const t = item.data;
            const execTime = item.timestamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            let eventText = '';
            if (t.status === 'pending') {
              eventText = `⏱️ [System Event] Engine wake-up timer set (execute_at: ${execTime}, Status: PENDING)`;
            } else if (t.status === 'completed') {
              eventText = `⏰ [System Event] Wake-up timer executed at ${execTime} (Status: COMPLETED)`;
            } else if (t.status === 'cancelled') {
              eventText = `🚫 [System Event] Pending timer cancelled due to new activity (Status: CANCELLED)`;
            }

            if (!existingEl) {
              const sysBubble = document.createElement('div');
              sysBubble.id = item.id;
              sysBubble.className = `message-bubble system ${t.status}`;
              sysBubble.innerText = eventText;
              container.appendChild(sysBubble);
              newAdded = true;
            } else {
              // Update in-place if status updated
              const newClassName = `message-bubble system ${t.status}`;
              if (existingEl.className !== newClassName || existingEl.innerText !== eventText) {
                existingEl.className = newClassName;
                existingEl.innerText = eventText;
              }
            }
          }
        });

        if (newAdded) {
          container.scrollTop = container.scrollHeight;
        }
      } catch (err) {
        console.error('Error fetching stream:', err);
      }
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const content = input.value.trim();
      if (!content || !activeSessionId) return;

      input.value = '';

      try {
        await fetch(`/sessions/${activeSessionId}/message`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });
        // Immediately trigger polling to show user message
        fetchStream();
      } catch (err) {
        console.error('Error sending message:', err);
      }
    }

    function handleInput(e) {
      const val = e.target.value;
      const cmdMenu = document.getElementById('cmdMenu');
      if (val.trim() === '/' || (val.startsWith('/') && !val.includes(' '))) {
        cmdMenu.style.display = 'block';
      } else {
        cmdMenu.style.display = 'none';
      }
    }

    function insertCommand(cmd) {
      const input = document.getElementById('userInput');
      const val = input.value;
      if (val.startsWith('/')) {
        input.value = cmd;
      } else {
        input.value = val + cmd;
      }
      document.getElementById('cmdMenu').style.display = 'none';
      input.focus();
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        document.getElementById('cmdMenu').style.display = 'none';
        sendMessage();
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }


    // Initial load
    fetchScenarios();
    fetchSessions();


    // Auto-poll messages and system task events every 2 seconds
    setInterval(() => {
      fetchStream();
    }, 2000);
  </script>
</body>
</html>
